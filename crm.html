<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CRM-WEHAVE - Loja e Negociação</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e9edef; color: #111b21; display: flex; justify-content: center; padding: 40px; }
        .container { width: 95%; max-width: 1200px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; }
        h1 { margin-top: 0; color: #25D366; border-bottom: 2px solid #e9edef; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; margin-top: 20px; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; display: flex; flex-direction: column; }
        h3 { margin-top: 0; color: #333; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        label { font-size: 13px; font-weight: bold; margin-top: 10px; display: block; }
        input[type="text"], textarea { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; }
        textarea.small { height: 80px; resize: none; }
        textarea.large { height: 120px; resize: none; }
        
        /* Estilos dos Botões */
        button { border: none; padding: 10px; margin-top: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 14px; width: 100%; color: white; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primario { background-color: #25D366; } .btn-primario:hover:not(:disabled) { background-color: #1DA851; }
        .btn-secundario { background-color: #007bff; } .btn-secundario:hover:not(:disabled) { background-color: #0056b3; }
        .btn-pausa { background-color: #ffc107; color: #000; } .btn-pausa:hover:not(:disabled) { background-color: #e0a800; }
        .btn-perigo { background-color: #dc3545; } .btn-perigo:hover:not(:disabled) { background-color: #c82333; }
        .btn-remover { background-color: #dc3545; padding: 5px 10px; margin: 0; width: auto; font-size: 12px; }
        
        .controles-campanha { display: flex; gap: 10px; margin-top: 15px; }
        .escondido { display: none !important; }
        
        .table-container { max-height: 250px; overflow-y: auto; margin-top: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; position: sticky; top: 0; }
        
        .checkbox-group { display: flex; align-items: center; margin-top: 15px; gap: 8px; background: #e8f5e9; padding: 10px; border-radius: 5px; }
        .checkbox-group input { margin: 0; width: 16px; height: 16px; }
        .checkbox-group label { margin: 0; cursor: pointer; color: #2e7d32; font-weight: bold; }
        .status-box { margin-top: 15px; padding: 10px; font-size: 14px; text-align: center; border-radius: 5px; background: #e9ecef; font-weight: bold; border: 1px solid #ced4da; }
        hr { border: 0; border-top: 1px dashed #ccc; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 CRM-WEHAVE - Negociação e Disparo</h1>
        
        <div class="grid">
            <div class="card">
                <h3>1. Inserir Leads / Clientes</h3>
                <label>Contato Único:</label>
                <input type="text" id="manualName" placeholder="Nome do Cliente">
                <input type="text" id="manualPhone" placeholder="WhatsApp (DDD + Número)">
                <button id="btnAddManual" class="btn-secundario">Adicionar à Fila</button>
                
                <hr>
                
                <label>Importação em Massa (Nome, Telefone):</label>
                <textarea id="manualBulk" class="small" placeholder="João Silva, 5511999999999&#10;Maria Souza, 5511888888888"></textarea>
                <button id="btnAddBulk" class="btn-secundario">Importar Lista</button>
            </div>

            <div class="card">
                <h3>2. Fila de Negociação (<span id="contadorFila">0</span> leads)</h3>
                
                <div class="table-container">
                    <table id="tabelaContatos">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th style="width: 50px;">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela"></tbody>
                    </table>
                </div>

                <label>Mensagem Base (Ofertas, Acessórios, Aparelhos):</label>
                <textarea id="mensagemBase" class="large" placeholder="Olá {{nome}}! Chegaram novidades em iPhones e capas protetoras aqui na WeHave. Tem interesse em dar uma olhada no catálogo atualizado?"></textarea>
                
                <div class="checkbox-group" id="containerSalvarBD">
                    <input type="checkbox" id="chkSalvarBD" checked>
                    <label for="chkSalvarBD">Salvar leads no banco de dados Firebase</label>
                </div>
                
                <div class="controles-campanha">
                    <button id="btnDisparar" class="btn-primario" style="font-size: 16px; padding: 15px;">▶ Iniciar Disparos</button>
                    <button id="btnPausar" class="btn-pausa escondido" style="font-size: 16px; padding: 15px;">⏸ Pausar</button>
                    <button id="btnRetomar" class="btn-primario escondido" style="font-size: 16px; padding: 15px;">▶ Retomar</button>
                    <button id="btnCancelar" class="btn-perigo escondido" style="font-size: 16px; padding: 15px;">⏹ Cancelar Tudo</button>
                </div>
                
                <div id="statusPainel" class="status-box">Status: Aguardando configuração da fila.</div>
            </div>
        </div>
    </div>

    <script type="module" src="crm.js"></script>
</body>
</html>

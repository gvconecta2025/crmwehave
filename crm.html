<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CRM-WEHAVE</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e9edef; color: #111b21; display: flex; justify-content: center; padding: 40px; }
        .container { width: 80%; max-width: 900px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; }
        h1 { margin-top: 0; color: #25D366; border-bottom: 2px solid #e9edef; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        h3 { margin-top: 0; color: #333; }
        label { font-size: 13px; font-weight: bold; margin-top: 10px; display: block; }
        input[type="text"], textarea { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; }
        textarea { height: 100px; resize: none; }
        button { width: 100%; background-color: #25D366; color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 15px; }
        button:hover { background-color: #1DA851; }
        button:disabled { background-color: #a5e0b8; cursor: not-allowed; }
        .checkbox-group { display: flex; align-items: center; margin-top: 15px; gap: 8px; }
        .checkbox-group input { margin: 0; width: 18px; height: 18px; }
        .checkbox-group label { margin: 0; cursor: pointer; }
        .status { margin-top: 15px; font-size: 14px; text-align: center; color: #555; font-weight: bold; }
        .info { font-size: 12px; color: #667781; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CRM-WEHAVE Dashboard</h1>
        
        <div class="grid">
            <!-- Coluna 1: Disparo em Lote -->
            <div class="card">
                <h3>Disparo em Lote (Catálogo)</h3>
                <label for="messageBatch">Mensagem Base:</label>
                <textarea id="messageBatch" placeholder="Olá {{nome}}! Temos novidades..."></textarea>
                <p class="info">Usa o banco de dados do Firebase. Use {{nome}} para personalizar.</p>
                
                <button id="btnBatch">Iniciar Campanha em Lote</button>
                <div id="statusBatch" class="status"></div>
            </div>

            <!-- Coluna 2: Disparo Manual -->
            <div class="card">
                <h3>Disparo Manual Único</h3>
                
                <label for="manualName">Nome do Cliente:</label>
                <input type="text" id="manualName" placeholder="Ex: João Pedro">
                
                <label for="manualPhone">WhatsApp (Com DDD):</label>
                <input type="text" id="manualPhone" placeholder="Ex: 5533999999999">
                
                <label for="messageManual">Mensagem:</label>
                <textarea id="messageManual" placeholder="Olá {{nome}}! O seu link de acesso é..."></textarea>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="saveToFirebase" checked>
                    <label for="saveToFirebase">Salvar este cliente no banco de dados Firebase</label>
                </div>
                
                <button id="btnManual">Disparar e Salvar</button>
                <div id="statusManual" class="status"></div>
            </div>
        </div>
    </div>

    <script type="module" src="crm.js"></script>
</body>
</html>
